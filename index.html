<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShuttleLog - 배드민턴 동호회 경기 분석</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <!-- 상단 헤더 -->
  <header class="bg-emerald-700 text-white shadow-md sticky top-0 z-10">
    <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
      <h1 class="text-lg font-bold tracking-tight">🏸 ShuttleLog 배드민턴 분석</h1>
      <span id="syncStatusBadge" class="text-xs bg-emerald-800 px-2.5 py-1 rounded-full">Myeong-ho Badminton Club</span>
    </div>
    <!-- 탭 네비게이션 -->
    <nav class="max-w-4xl mx-auto px-4 flex space-x-2 text-sm font-medium border-t border-emerald-600">
      <button onclick="switchTab('match')" id="tab-match" class="tab-btn py-2.5 px-4 border-b-2 border-white font-bold">경기 등록</button>
      <button onclick="switchTab('analytics')" id="tab-analytics" class="tab-btn py-2.5 px-4 border-b-2 border-transparent text-emerald-100 hover:text-white">분석 현황</button>
      <button onclick="switchTab('players')" id="tab-players" class="tab-btn py-2.5 px-4 border-b-2 border-transparent text-emerald-100 hover:text-white">선수 관리</button>
    </nav>
  </header>

  <main class="max-w-4xl mx-auto p-4 space-y-6">
    <!-- 1. 경기 결과 등록 섹션 -->
    <section id="sec-match" class="space-y-4">
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-base font-bold mb-4 text-slate-700">새 경기 결과 입력</h2>
        <form id="matchForm" class="space-y-4">
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">경기 날짜</label>
              <input type="date" id="matchDate" required class="w-full border rounded-lg px-3 py-2 text-sm" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">종목 (자동 판별)</label>
              <select id="matchType" class="w-full border rounded-lg px-3 py-2 text-sm bg-slate-50">
                <option value="남복">남자복식 (남복)</option>
                <option value="여복">여자복식 (여복)</option>
                <option value="혼복">혼합복식 (혼복)</option>
              </select>
            </div>
          </div>

          <!-- 팀 구성 및 점수 -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
            <!-- A팀 -->
            <div class="bg-blue-50/70 p-4 rounded-xl border border-blue-200 space-y-2.5">
              <div class="flex justify-between items-center">
                <span class="font-bold text-blue-800 text-sm">A 팀</span>
                <input type="number" id="scoreA" min="0" max="50" value="25" required class="w-20 text-center font-bold text-lg border border-blue-300 rounded-lg py-1 bg-white" />
              </div>
              <select id="teamA1" onchange="autoDetectMatchType()" required class="player-select w-full border rounded-lg px-3 py-2 text-sm bg-white"></select>
              <select id="teamA2" onchange="autoDetectMatchType()" required class="player-select w-full border rounded-lg px-3 py-2 text-sm bg-white"></select>
            </div>

            <!-- B팀 -->
            <div class="bg-rose-50/70 p-4 rounded-xl border border-rose-200 space-y-2.5">
              <div class="flex justify-between items-center">
                <span class="font-bold text-rose-800 text-sm">B 팀</span>
                <input type="number" id="scoreB" min="0" max="50" value="21" required class="w-20 text-center font-bold text-lg border border-rose-300 rounded-lg py-1 bg-white" />
              </div>
              <select id="teamB1" onchange="autoDetectMatchType()" required class="player-select w-full border rounded-lg px-3 py-2 text-sm bg-white"></select>
              <select id="teamB2" onchange="autoDetectMatchType()" required class="player-select w-full border rounded-lg px-3 py-2 text-sm bg-white"></select>
            </div>
          </div>

          <div>
            <input type="text" id="matchMemo" placeholder="메모 (예: 1코트, 듀스 접전 등 - 선택사항)" class="w-full border rounded-lg px-3 py-2 text-sm" />
          </div>

          <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg text-sm transition">
            경기 결과 저장하기
          </button>
        </form>
      </div>

      <!-- 최근 경기 목록 -->
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
        <h3 class="text-sm font-bold text-slate-700 mb-3">최근 등록된 경기</h3>
        <div id="recentMatchesList" class="divide-y text-sm"></div>
      </div>
    </section>

    <!-- 2. 분석 현황 섹션 -->
    <section id="sec-analytics" class="hidden space-y-4">
      <!-- 클럽 전체 요약 -->
      <div class="grid grid-cols-3 gap-3">
        <div class="bg-white p-4 rounded-xl border text-center">
          <div class="text-xs text-slate-500">총 등록 선수</div>
          <div id="stat-total-players" class="text-xl font-bold text-emerald-700 mt-1">0명</div>
        </div>
        <div class="bg-white p-4 rounded-xl border text-center">
          <div class="text-xs text-slate-500">누적 경기 수</div>
          <div id="stat-total-matches" class="text-xl font-bold text-slate-800 mt-1">0경기</div>
        </div>
        <div class="bg-white p-4 rounded-xl border text-center">
          <div class="text-xs text-slate-500">다승 1위</div>
          <div id="stat-top-winner" class="text-base font-bold text-blue-700 mt-1.5 truncate">-</div>
        </div>
      </div>

      <!-- 개인별 상세 분석 -->
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-4">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
          <h2 class="text-base font-bold text-slate-700">개인별 상세 분석</h2>
          <select id="analyticsPlayerSelect" onchange="renderPlayerAnalytics()" class="border rounded-lg px-3 py-2 text-sm font-medium bg-slate-50"></select>
        </div>

        <div id="playerAnalyticsContent" class="space-y-4"></div>
      </div>

      <!-- 클럽 전체 랭킹 테이블 -->
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
        <h3 class="text-sm font-bold text-slate-700 mb-3">전체 회원 승률 순위</h3>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm">
            <thead class="bg-slate-100 text-slate-600 text-xs">
              <tr>
                <th class="p-2.5">선수 (급수/생년)</th>
                <th class="p-2.5 text-center">경기</th>
                <th class="p-2.5 text-center">승/패</th>
                <th class="p-2.5 text-right">승률</th>
              </tr>
            </thead>
            <tbody id="rankingTableBody" class="divide-y"></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- 3. 선수 관리 섹션 -->
    <section id="sec-players" class="hidden space-y-4">
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-base font-bold mb-1 text-slate-700">신규 선수 및 승급 등록</h2>
        <p class="text-xs text-slate-500 mb-4">이름, 급수, 생년, 성별이 모두 동일한 선수는 중복 등록되지 않습니다.</p>

        <form id="playerForm" class="grid grid-cols-2 sm:grid-cols-5 gap-2.5">
          <input type="text" id="pName" placeholder="이름" required class="border rounded-lg px-3 py-2 text-sm" />
          <select id="pGrade" required class="border rounded-lg px-3 py-2 text-sm">
            <option value="S">S조</option>
            <option value="A">A조</option>
            <option value="B">B조</option>
            <option value="C" selected>C조</option>
            <option value="D">D조</option>
          </select>
          <input type="number" id="pBirth" placeholder="생년 (예: 1985)" min="1940" max="2020" required class="border rounded-lg px-3 py-2 text-sm" />
          <select id="pGender" required class="border rounded-lg px-3 py-2 text-sm">
            <option value="남">남성</option>
            <option value="여">여성</option>
          </select>
          <button type="submit" class="col-span-2 sm:col-span-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded-lg text-sm">
            등록
          </button>
        </form>
      </div>

      <!-- 등록 선수 목록 -->
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
        <div class="flex justify-between items-center mb-3">
          <h3 class="text-sm font-bold text-slate-700">등록 선수 목록</h3>
          <label class="text-xs text-slate-500 flex items-center gap-1">
            <input type="checkbox" id="showInactive" onchange="renderPlayersList()" /> 비활성(이전 급수) 포함
          </label>
        </div>
        <div id="playersList" class="divide-y text-sm"></div>
      </div>
    </section>
  </main>

  <script>
    // Google Apps Script 웹 앱 주소 (/exec)를 아래 따옴표 안에 넣어주세요.
    const API_URL = https://script.google.com/macros/s/AKfycbyeqa8DuPYdw6eM_f3BTfx9ALHIofsfDAHOtbUwW3xUKG5x4-3EVfLTcowsTh7Fyuyb/exec;

    // 초기 데이터 로드 (LocalStorage 캐시 + Google 스프레드시트 동기화)
    let players = JSON.parse(localStorage.getItem('sl_players') || '[]');
    let matches = JSON.parse(localStorage.getItem('sl_matches') || '[]');

    document.getElementById('matchDate').valueAsDate = new Date();

    function hasValidApiUrl() {
      return Boolean(API_URL) && !API_URL.includes('여기에_배포한_웹_앱_URL_입력') && API_URL.startsWith('https://');
    }

    function setSyncBadge(text) {
      const badge = document.getElementById('syncStatusBadge');
      if (badge) badge.textContent = text;
    }

    function saveData() {
      localStorage.setItem('sl_players', JSON.stringify(players));
      localStorage.setItem('sl_matches', JSON.stringify(matches));
    }

    async function loadFromSheet() {
      if (!hasValidApiUrl()) {
        setSyncBadge('로컬 저장 모드');
        return;
      }
      setSyncBadge('시트 동기화 중...');
      try {
        const res = await fetch(API_URL, { cache: 'no-store' });
        const data = await res.json();
        if (data.ok) {
          players = data.players || [];
          matches = data.matches || [];
          saveData();
          updatePlayerDropdowns();
          renderPlayersList();
          renderRecentMatches();
          if (!document.getElementById('sec-analytics').classList.contains('hidden')) {
            renderAnalytics();
          }
          setSyncBadge('시트 연동됨');
        } else {
          setSyncBadge('시트 응답 오류');
        }
      } catch (err) {
        console.error('스프레드시트 불러오기 실패:', err);
        setSyncBadge('오프라인/캐시 모드');
      }
    }

    async function postToSheet(payload) {
      if (!hasValidApiUrl()) return { ok: true };
      setSyncBadge('시트 저장 중...');
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        setSyncBadge(data.ok ? '시트 연동됨' : '시트 저장 오류');
        return data;
      } catch (err) {
        console.error('스프레드시트 저장 실패:', err);
        setSyncBadge('시트 저장 오류');
        return { ok: false, error: err.message };
      }
    }

    function switchTab(tab) {
      ['match', 'analytics', 'players'].forEach(t => {
        document.getElementById(`sec-${t}`).classList.toggle('hidden', t !== tab);
        const btn = document.getElementById(`tab-${t}`);
        btn.classList.toggle('border-white', t === tab);
        btn.classList.toggle('font-bold', t === tab);
        btn.classList.toggle('border-transparent', t !== tab);
        btn.classList.toggle('text-emerald-100', t !== tab);
      });
      if (tab === 'analytics') {
        renderAnalytics();
        loadFromSheet();
      }
      if (tab === 'players') {
        renderPlayersList();
        loadFromSheet();
      }
      if (tab === 'match') {
        updatePlayerDropdowns();
        loadFromSheet();
      }
    }

    // 1. 선수 등록 및 중복 검증
    document.getElementById('playerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('pName').value.trim();
      const grade = document.getElementById('pGrade').value;
      const birth = document.getElementById('pBirth').value.trim();
      const gender = document.getElementById('pGender').value;

      // 모든 선수등록정보(이름, 급수, 생년, 남여) 동일 여부 검사
      const isDuplicate = players.some(p =>
        p.name === name && p.grade === grade && String(p.birth) === birth && p.gender === gender
      );

      if (isDuplicate) {
        alert('동일한 정보(이름, 급수, 생년, 성별)의 선수가 이미 등록되어 있습니다.\n승급한 경우 급수를 변경해 등록해주세요.');
        return;
      }

      const newPlayer = {
        id: 'P_' + Date.now(),
        name, grade, birth, gender,
        active: true,
        createdAt: new Date().toISOString().slice(0, 10)
      };

      const res = await postToSheet({ action: 'addPlayer', player: newPlayer });
      if (!res.ok && res.error === 'DUPLICATE_PLAYER') {
        alert('스프레드시트에 이미 동일한 선수 정보가 등록되어 있습니다.');
        await loadFromSheet();
        return;
      }

      players.push(newPlayer);
      saveData();
      e.target.reset();
      document.getElementById('pGrade').value = 'C';
      renderPlayersList();
      updatePlayerDropdowns();
      alert(`${name} (${grade}조) 선수가 등록되었습니다.`);
    });

    // 승급 간편 처리 (기존 프로필 비활성화 + 새 급수 등록)
    async function promotePlayer(id) {
      const target = players.find(p => p.id === id);
      if (!target) return;
      const grades = ['D', 'C', 'B', 'A', 'S'];
      const nextIdx = grades.indexOf(target.grade) + 1;
      const suggested = nextIdx < grades.length ? grades[nextIdx] : 'S';
      const newGrade = prompt(`${target.name} 선수의 새 급수를 입력하세요 (S, A, B, C, D):`, suggested);
      if (!newGrade || !grades.includes(newGrade.toUpperCase())) return;

      const upperGrade = newGrade.toUpperCase();
      const isDuplicate = players.some(p =>
        p.name === target.name && p.grade === upperGrade && String(p.birth) === String(target.birth) && p.gender === target.gender
      );
      if (isDuplicate) {
        alert('해당 급수로 이미 등록된 정보가 존재합니다.');
        return;
      }

      const newPlayer = {
        id: 'P_' + Date.now(),
        name: target.name,
        grade: upperGrade,
        birth: String(target.birth),
        gender: target.gender,
        active: true,
        createdAt: new Date().toISOString().slice(0, 10)
      };

      await postToSheet({
        action: 'promotePlayer',
        oldPlayerId: target.id,
        newPlayer,
        prevGrade: target.grade
      });

      target.active = false; // 기존 급수 기록 보존용 비활성화
      players.push(newPlayer);
      saveData();
      renderPlayersList();
      updatePlayerDropdowns();
    }

    async function togglePlayerActive(id) {
      const p = players.find(x => x.id === id);
      if (p) {
        const nextActive = !p.active;
        await postToSheet({ action: 'togglePlayerActive', id: p.id, active: nextActive });
        p.active = nextActive;
        saveData();
        renderPlayersList();
        updatePlayerDropdowns();
      }
    }

    function formatPlayerLabel(p) {
      return `${p.name} (${p.grade}조 · ${String(p.birth).slice(2)}년 · ${p.gender})`;
    }

    function renderPlayersList() {
      const showInactive = document.getElementById('showInactive').checked;
      const list = players.filter(p => showInactive || p.active);
      const container = document.getElementById('playersList');

      if (!list.length) {
        container.innerHTML = '<p class="text-slate-400 py-4 text-center">등록된 선수가 없습니다.</p>';
        return;
      }

      container.innerHTML = list.map(p => `
        <div class="py-2.5 flex items-center justify-between ${!p.active ? 'opacity-50' : ''}">
          <div>
            <span class="font-bold text-slate-800">${p.name}</span>
            <span class="ml-1.5 text-xs px-2 py-0.5 rounded bg-emerald-100 text-emerald-800 font-semibold">${p.grade}조</span>
            <span class="text-xs text-slate-500 ml-1">${p.birth}년생 · ${p.gender}</span>
            ${!p.active ? '<span class="text-xs text-rose-500 ml-1">[이전급수/비활성]</span>' : ''}
          </div>
          <div class="space-x-1.5">
            ${p.active ? `<button onclick="promotePlayer('${p.id}')" class="text-xs bg-blue-50 text-blue-700 border border-blue-200 px-2 py-1 rounded hover:bg-blue-100">승급</button>` : ''}
            <button onclick="togglePlayerActive('${p.id}')" class="text-xs bg-slate-100 text-slate-600 px-2 py-1 rounded hover:bg-slate-200">
              ${p.active ? '비활성' : '복구'}
            </button>
          </div>
        </div>
      `).join('');
    }

    // 2. 경기 등록 관련
    function updatePlayerDropdowns() {
      const activePlayers = players.filter(p => p.active);
      const optionsHtml = '<option value="">선수 선택</option>' +
        activePlayers.map(p => `<option value="${p.id}">${formatPlayerLabel(p)}</option>`).join('');

      document.querySelectorAll('.player-select').forEach(sel => {
        const prev = sel.value;
        sel.innerHTML = optionsHtml;
        sel.value = prev;
      });
      renderRecentMatches();
    }

    function autoDetectMatchType() {
      const ids = ['teamA1', 'teamA2', 'teamB1', 'teamB2'].map(id => document.getElementById(id).value).filter(Boolean);
      if (ids.length < 4) return;
      const selected = ids.map(id => players.find(p => p.id === id)).filter(Boolean);
      const males = selected.filter(p => p.gender === '남').length;
      const typeSelect = document.getElementById('matchType');
      if (males === 4) typeSelect.value = '남복';
      else if (males === 0) typeSelect.value = '여복';
      else typeSelect.value = '혼복';
    }

    document.getElementById('matchForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const a1 = document.getElementById('teamA1').value;
      const a2 = document.getElementById('teamA2').value;
      const b1 = document.getElementById('teamB1').value;
      const b2 = document.getElementById('teamB2').value;

      if (new Set([a1, a2, b1, b2]).size < 4) {
        alert('동일한 선수가 중복 선택되었습니다. 4명의 서로 다른 선수를 선택해주세요.');
        return;
      }

      const newMatch = {
        id: 'M_' + Date.now(),
        date: document.getElementById('matchDate').value,
        type: document.getElementById('matchType').value,
        teamA: [a1, a2],
        teamB: [b1, b2],
        scoreA: Number(document.getElementById('scoreA').value),
        scoreB: Number(document.getElementById('scoreB').value),
        memo: document.getElementById('matchMemo').value.trim()
      };

      await postToSheet({ action: 'addMatch', match: newMatch });
      matches.unshift(newMatch);
      saveData();
      document.getElementById('matchMemo').value = '';
      renderRecentMatches();
      alert('경기 결과가 저장되었습니다.');
    });

    function getPlayerName(id) {
      const p = players.find(x => x.id === id);
      return p ? `${p.name}(${p.grade})` : '미상';
    }

    async function deleteMatch(id) {
      if (!confirm('이 경기 기록을 삭제하시겠습니까?')) return;
      await postToSheet({ action: 'deleteMatch', id });
      matches = matches.filter(m => m.id !== id);
      saveData();
      renderRecentMatches();
    }

    function renderRecentMatches() {
      const container = document.getElementById('recentMatchesList');
      if (!matches.length) {
        container.innerHTML = '<p class="text-slate-400 py-4 text-center">등록된 경기 결과가 없습니다.</p>';
        return;
      }
      container.innerHTML = matches.slice(0, 15).map(m => {
        const aWin = m.scoreA > m.scoreB;
        return `
          <div class="py-3 flex items-center justify-between gap-2">
            <div class="space-y-0.5">
              <div class="text-xs text-slate-400">${m.date} · <span class="font-semibold text-emerald-700">${m.type}</span> ${m.memo ? `· ${m.memo}` : ''}</div>
              <div class="text-sm">
                <span class="${aWin ? 'font-bold text-blue-700' : 'text-slate-600'}">${getPlayerName(m.teamA[0])}, ${getPlayerName(m.teamA[1])}</span>
                <span class="mx-1.5 font-bold px-2 py-0.5 rounded bg-slate-100">${m.scoreA} : ${m.scoreB}</span>
                <span class="${!aWin ? 'font-bold text-rose-700' : 'text-slate-600'}">${getPlayerName(m.teamB[0])}, ${getPlayerName(m.teamB[1])}</span>
              </div>
            </div>
            <button onclick="deleteMatch('${m.id}')" class="text-xs text-slate-400 hover:text-rose-600">삭제</button>
          </div>
        `;
      }).join('');
    }

    // 3. 분석 현황 계산
    function calcStats(playerId) {
      const pMatches = matches.filter(m => m.teamA.includes(playerId) || m.teamB.includes(playerId));
      let wins = 0, losses = 0, curStreak = 0, maxStreak = 0;
      const byType = { '남복': { w: 0, l: 0 }, '여복': { w: 0, l: 0 }, '혼복': { w: 0, l: 0 } };
      const partners = {};

      // 날짜 오름차순으로 연승 계산
      [...pMatches].reverse().forEach(m => {
        const isTeamA = m.teamA.includes(playerId);
        const isWin = isTeamA ? (m.scoreA > m.scoreB) : (m.scoreB > m.scoreA);
        const partnerId = (isTeamA ? m.teamA : m.teamB).find(id => id !== playerId);

        if (isWin) {
          wins++;
          curStreak++;
          if (curStreak > maxStreak) maxStreak = curStreak;
          if (byType[m.type]) byType[m.type].w++;
        } else {
          losses++;
          curStreak = 0;
          if (byType[m.type]) byType[m.type].l++;
        }

        if (partnerId) {
          if (!partners[partnerId]) partners[partnerId] = { w: 0, l: 0 };
          isWin ? partners[partnerId].w++ : partners[partnerId].l++;
        }
      });

      const total = wins + losses;
      const rate = total ? Math.round((wins / total) * 100) : 0;
      return { total, wins, losses, rate, curStreak, maxStreak, byType, partners };
    }

    function renderAnalytics() {
      document.getElementById('stat-total-players').textContent = `${players.filter(p => p.active).length}명`;
      document.getElementById('stat-total-matches').textContent = `${matches.length}경기`;

      const ranked = players.map(p => ({ player: p, ...calcStats(p.id) }))
        .filter(x => x.total > 0)
        .sort((a, b) => b.wins - a.wins || b.rate - a.rate);

      document.getElementById('stat-top-winner').textContent = ranked[0] ? `${ranked[0].player.name} (${ranked[0].wins}승)` : '-';

      // 전체 랭킹 테이블
      const tbody = document.getElementById('rankingTableBody');
      tbody.innerHTML = ranked.length ? ranked.map(r => `
        <tr>
          <td class="p-2.5 font-medium">${r.player.name} <span class="text-xs text-slate-400">(${r.player.grade}조/${String(r.player.birth).slice(2)})</span></td>
          <td class="p-2.5 text-center">${r.total}</td>
          <td class="p-2.5 text-center">${r.wins}승 ${r.losses}패</td>
          <td class="p-2.5 text-right font-bold text-emerald-700">${r.rate}%</td>
        </tr>
      `).join('') : '<tr><td colspan="4" class="p-4 text-center text-slate-400">경기 데이터가 부족합니다.</td></tr>';

      // 개인 분석 드롭다운
      const sel = document.getElementById('analyticsPlayerSelect');
      const prev = sel.value;
      sel.innerHTML = players.map(p => `<option value="${p.id}">${formatPlayerLabel(p)}${!p.active ? ' [이전급수]' : ''}</option>`).join('');
      if (prev) sel.value = prev;
      renderPlayerAnalytics();
    }

    function renderPlayerAnalytics() {
      const pid = document.getElementById('analyticsPlayerSelect').value;
      const box = document.getElementById('playerAnalyticsContent');
      if (!pid) {
        box.innerHTML = '<p class="text-sm text-slate-400">선수를 먼저 등록해주세요.</p>';
        return;
      }

      const s = calcStats(pid);
      const partnerList = Object.entries(s.partners)
        .map(([id, rec]) => ({
          name: getPlayerName(id),
          total: rec.w + rec.l,
          wins: rec.w,
          rate: Math.round((rec.w / (rec.w + rec.l)) * 100)
        }))
        .sort((a, b) => b.rate - a.rate || b.total - a.total);

      box.innerHTML = `
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5 text-center">
          <div class="bg-slate-50 p-3 rounded-lg">
            <div class="text-xs text-slate-500">전적 / 승률</div>
            <div class="font-bold text-base mt-0.5">${s.wins}승 ${s.losses}패 (${s.rate}%)</div>
          </div>
          <div class="bg-slate-50 p-3 rounded-lg">
            <div class="text-xs text-slate-500">현재 / 최고 연승</div>
            <div class="font-bold text-base mt-0.5 text-blue-700">${s.curStreak}연승 / ${s.maxStreak}연승</div>
          </div>
          <div class="bg-slate-50 p-3 rounded-lg">
            <div class="text-xs text-slate-500">남복 / 여복</div>
            <div class="font-semibold text-sm mt-1">
              남 ${s.byType['남복'].w}승${s.byType['남복'].l}패 · 여 ${s.byType['여복'].w}승${s.byType['여복'].l}패
            </div>
          </div>
          <div class="bg-slate-50 p-3 rounded-lg">
            <div class="text-xs text-slate-500">혼복 전적</div>
            <div class="font-semibold text-sm mt-1">${s.byType['혼복'].w}승 ${s.byType['혼복'].l}패</div>
          </div>
        </div>

        <div>
          <h4 class="text-xs font-bold text-slate-500 mb-2">파트너별 호흡 (승률순)</h4>
          ${partnerList.length ? `
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
              ${partnerList.map(pt => `
                <div class="flex justify-between items-center border rounded-lg px-3 py-2 text-xs">
                  <span class="font-bold">${pt.name}</span>
                  <span>${pt.total}전 ${pt.wins}승 (<strong class="text-emerald-700">${pt.rate}%</strong>)</span>
                </div>
              `).join('')}
            </div>
          ` : '<p class="text-xs text-slate-400">파트너 기록이 없습니다.</p>'}
        </div>
      `;
    }

    // 초기 실행 및 구글 시트 동기화
    updatePlayerDropdowns();
    renderPlayersList();
    loadFromSheet();
  </script>
</body>
</html>
